[project]
name = "galaxy-tool-codemod"
version = "0.3.4"
description = "Structural-refactor framework for Galaxy tool XML — tier 2 of the galaxy-tool-source ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Richard Burhans" }]
dependencies = [
    "galaxy-tool-refactor-rules==0.3.4",
    "galaxy-tool-source==0.3.4",
    "lxml>=5",
    "packaging>=23",       # version comparison in profile_semantics / runtime_fixes
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    # the galaxy-tool-source[shell-oracle] extra, so GTR020.1's widen/narrow tests run.
    "bashlex>=0.18",
]

[tool.ruff]
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
# lxml ships no type information.
module = ["lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
galaxy-tool-refactor-rules = { workspace = true }
galaxy-tool-source = { workspace = true }
