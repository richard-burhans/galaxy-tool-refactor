# Read the Docs configuration (v2) for the galaxy-tool-refactor guide.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Matches the Galaxy-family convention (planemo / bioblend / ephemeris / pulsar /
# gxformat2), with two deliberate differences:
#   * the Sphinx project is rooted at docs/guide/ (the public guide) rather than
#     docs/, because docs/ also holds internal decision/stat artifacts that are
#     not part of the published documentation;
#   * the project itself is NOT pip-installed (no autodoc; this is a uv workspace
#     with no installable root package) — only the docs requirements are needed.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/guide/conf.py

python:
  install:
    - requirements: docs/guide/requirements.txt
