[project]
name = "galaxy-tool-lint"
version = "0.3.2"
description = "Advisory (detect-only) IUC best-practice checks for Galaxy tool XML — tier 3.5 of the galaxy-tool-source ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Richard Burhans" }]
# Advisory checks are read-only tree queries over tier-1 (`ToolDocument`) that
# report findings as the shared tier-0.5 `Violation`. They do NOT depend on the
# mutating tiers (codemod / fmt) — the app composes this alongside them.
dependencies = [
    # GTR089.2 validates <help> reStructuredText via the shared tier-1 predicate
    # (`galaxy_tool_source.rst`), so docutils is a transitive dep of tier 1, not declared here.
    "galaxy-tool-refactor-rules==0.3.2",
    "galaxy-tool-source==0.3.2",
    "lxml>=5",
    "packaging>=23",
]

[project.optional-dependencies]
# GTR100/GTR101 bind Galaxy's own test-validation linters (assertion + test-case
# models) rather than reimplement their evolving pydantic logic. Opt-in: without
# this extra the two rules yield nothing. See galaxy_tool_lint/checks/test_validation.py
# and docs/galaxy_reimplementations.md Touchpoint 5.
test-validation = ["galaxy-tool-util>=25.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    # the galaxy-tool-source[shell-oracle] extra: GTR020.2's residual uses the shared
    # quote_is_behavior_preserving policy, which consults bashlex when present.
    "bashlex>=0.18",
]

[tool.ruff]
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]

[tool.mypy]
files = ["src"]
strict = true

[[tool.mypy.overrides]]
# lxml ships no (usable) type information.
module = ["lxml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# galaxy-tool-util (the opt-in [test-validation] extra) ships no type information
# and is imported lazily inside checks/test_validation.py.
module = ["galaxy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
galaxy-tool-refactor-rules = { workspace = true }
galaxy-tool-source = { workspace = true }
