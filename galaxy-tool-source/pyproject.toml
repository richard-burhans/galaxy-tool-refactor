[project]
name = "galaxy-tool-source"
version = "0.3.4"
description = "Foundation library for parsing, profile-aware validation, and typed inspection of Galaxy tool XML"
authors = [{ name = "Richard Burhans", email = "richard.burhans@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["galaxy", "bioinformatics", "tool-xml", "xsd", "validation", "cheetah"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]
dependencies = [
    "xsdata[lxml]>=26.2",
    "lxml>=5",             # declared explicitly: galaxy-util needs lxml but does not declare it
    "click>=8",
    # galaxy-util: macro expansion (galaxy.util.xml_macros). The [template] extra pulls
    # in CT3 (the maintained, MIT-licensed Cheetah3 fork) for the faithful Cheetah lexer
    # (galaxy_tool_source.cheetah_cdm) — a REQUIRED dependency: the faithful path is the
    # default for find-references / GTR020 / rename, not an opt-in. internal API -> ranged pin.
    "galaxy-util[template]>=24,<27",
    "packaging>=23",       # version comparison; only a transitive dep of galaxy-util otherwise
    # docutils: reStructuredText validity + the surgical <help> RST repair
    # (galaxy_tool_source.rst) — the shared predicate behind the GTR089 fix/advisory
    # partition. Galaxy renders <help> RST via galaxy.util.rst_to_html (docutils).
    "docutils>=0.21",
]

[project.optional-dependencies]
# The shell boundary oracle (galaxy_tool_source.shell_oracle). bashlex is GPL v3+, so
# it is isolated behind this extra rather than a hard dependency of this MIT tier;
# shell_oracle degrades gracefully when it is absent. See
# ../docs/upgrade_research/cheetah_bashlex_boundary_oracle.md.
# (CT3 — the faithful Cheetah lexer — is MIT, so unlike bashlex it is NOT gated behind
# an extra: it is a base dependency above. cheetah_cdm still returns None on the ~0.4%
# of bodies CT3 cannot compile, where callers fall back to the regex; see §19.)
shell-oracle = ["bashlex>=0.18"]
# The RST->Markdown <help> conversion gate (galaxy_tool_source.rst_markdown):
# markdown-it-py's "js-default" preset renders the converted CommonMark exactly as
# Galaxy's client does (MarkdownIt({html:false})), and a conversion is kept only
# when that rendering is semantically equal to the docutils server rendering.
# Conversion without the gate is unsound, so the feature refuses cleanly when this
# extra is absent (markdown_renderer_available()). MIT, but opt-in-feature-only ->
# an extra, not a base dep (the bashlex pattern; it IS in dev so tests run in CI).
markdown = ["markdown-it-py>=4"]

[project.urls]
Homepage = "https://github.com/richard-burhans/galaxy-tool-refactor"
Repository = "https://github.com/richard-burhans/galaxy-tool-refactor"
Issues = "https://github.com/richard-burhans/galaxy-tool-refactor/issues"

[project.scripts]
galaxy-tool-source = "galaxy_tool_source.cli:main"

[dependency-groups]
# xsdata[cli] supplies the codegen toolchain (ResourceTransformer and its
# deps); scripts/regenerate.py and tests/test_codegen.py need it.
# mercurial is invoked by scripts/fetch_toolshed.py to clone toolshed repos
# (the Galaxy ToolShed exposes its content only over the Mercurial wire
# protocol; the pip-installed package brings its own `hg` binary).
# bashlex: the shell-oracle extra, in dev so its tests run in CI.
# (CT3 for the faithful lexer is now a base dependency — galaxy-util[template] above —
# so it no longer needs a dev entry.)
# markdown-it-py: the RST->CommonMark gate proxy for `scripts.measure
# help-rst-md-convert` (its "js-default" preset mirrors the client-side
# MarkdownIt({html:false}) Galaxy renders markdown <help> with); dev so the
# measure's synthetic-fixture test runs in CI. NOT a library dependency — the
# converter itself is research-only (no shipped RST->MD codemod).
# galaxy-tool-util: Galaxy's REAL strict test-case validator
# (galaxy.tool_util.parameters.validate_test_cases_for_tool_source, the exact
# call ProfileMigration24_2.advise makes) for `scripts.measure
# test-case-validation-truth`; dev so the measure's synthetic-fixture test runs
# in CI. NOT a library dependency; shipping it in a tier is the separate
# [galaxy]-extra decision (PR 3 of the behavior-gate arc).
dev = [
    "xsdata[cli]>=26.2",
    "pytest>=8",
    "ruff",
    "mypy",
    "mercurial>=6",
    "bashlex>=0.18",
    "markdown-it-py>=4",
    "galaxy-tool-util>=25.1",
]

[build-system]
# xsdata[cli] is required at build time: the hook runs the model codegen.
requires = ["hatchling>=1.27", "xsdata[cli,lxml]>=26.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/galaxy_tool_source"]
# The per-version model packages are generated by the build hook and gitignored;
# whitelist them back into the wheel.
artifacts = [
    "src/galaxy_tool_source/models/v*",
    "src/galaxy_tool_source/models/any_tool.py",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: xsdata codegen sweep over every vendored XSD"]
addopts = "-m 'not slow'"
# Workspace root on sys.path so tests can do ``import scripts.corpus_check``.
pythonpath = [".."]

[tool.ruff]
src = ["src"]
target-version = "py310"
# Generated code only — the hand-written models/__init__.py and registry.py
# are still linted.
extend-exclude = [
    "src/galaxy_tool_source/models/v*",
    "src/galaxy_tool_source/models/any_tool.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]

[tool.mypy]
files = ["src"]
strict = true
# Generated code only — the hand-written models/__init__.py and registry.py
# are still type-checked.
exclude = "src/galaxy_tool_source/models/(v[0-9].*|any_tool\\.py)"

# lxml, galaxy-util, bashlex (the shell-oracle extra), and Cheetah/CT3 (the faithful
# lexer, a base dependency) ship no type information.
[[tool.mypy.overrides]]
module = ["lxml.*", "galaxy.*", "bashlex.*", "Cheetah.*", "docutils.*", "markdown_it.*"]
ignore_missing_imports = true
