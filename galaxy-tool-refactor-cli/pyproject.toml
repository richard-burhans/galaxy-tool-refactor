[project]
name = "galaxy-tool-refactor-cli"
version = "0.1.0"
description = "Top-level CLI app that composes the Galaxy tool refactoring tiers (format + upgrade)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Richard Burhans" }]
# Orchestration now lives in the registry facade (tier 3.6); the CLI composes
# it plus fmt's file-walking engine (cli_support) and tier-1 parsing. It no
# longer depends on the codemod / check tiers directly — the facade wraps them.
dependencies = [
    "galaxy-tool-refactor-rules",
    "galaxy-tool-xml",
    "galaxy-tool-xml-fmt",
    "galaxy-tool-refactor-registry",
    "click>=8",
]

[project.scripts]
galaxy-tool-refactor = "galaxy_tool_refactor_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
src = ["src"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH"]

[tool.mypy]
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
galaxy-tool-refactor-rules = { workspace = true }
galaxy-tool-xml = { workspace = true }
galaxy-tool-xml-fmt = { workspace = true }
galaxy-tool-refactor-registry = { workspace = true }
