name: CI

# Runs the workspace QA gate (scripts/qa_gate.sh — the single source for the
# package roster: ruff + per-package strict mypy + the eight test suites) on
# every PR and on pushes to main. No corpus is needed — the unit/regression
# tests use synthetic data and committed fixtures; the slow xsdata-codegen
# sweep stays behind the `slow` marker and is not run here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync workspace
        # Installs all eight packages + dev deps; the galaxy-tool-xml build hook
        # regenerates the per-version xsdata models from the vendored XSDs.
        run: uv sync

      - name: QA gate (ruff + mypy strict + pytest, all packages)
        # Single source of truth for the package roster: scripts/qa_gate.sh —
        # the same script the pre-push hook runs. CI used to inline the same
        # three command blocks and the rosters drifted (the check tier was once
        # silently dropped here). On failure the gate names the failing step
        # ("QA gate FAILED at: mypy (<package>)"). FORCE bypasses the gate's
        # green-tree cache — meaningless on a fresh checkout, explicit anyway.
        run: QA_GATE_FORCE=1 bash scripts/qa_gate.sh
