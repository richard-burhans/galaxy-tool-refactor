name: Release to PyPI (all packages)

# Tag-triggered, lockstep publish of all nine workspace distributions (the eight
# tier packages + the galaxy-tool-refactor metapackage) via PyPI Trusted
# Publishing (OIDC — no stored token). The packages share one version
# (galaxy-tool-source/docs/decisions.md §27); tag a release as `v<version>`
# matching that shared version, push the tag, and this builds every package's
# sdist+wheel and uploads them in one Trusted-Publishing call.
#
# One-time PyPI setup (a maintainer, on pypi.org), once PER PACKAGE — Account →
# Publishing → add a pending publisher with: owner `richard-burhans`, repo
# `galaxy-tool-refactor`, workflow `release.yml`, environment `pypi`, and the
# project name set to each of the nine dist names:
#   galaxy-tool-refactor-rules, galaxy-tool-source, galaxy-tool-codemod,
#   galaxy-tool-fmt, galaxy-tool-lint, galaxy-tool-refactor-registry,
#   galaxy-tool-refactor-cli, galaxy-tool-refactor-mcp, galaxy-tool-refactor
# (the last is the front-door metapackage; galaxy-tool-source already has a
# publisher from the 0.1.0 release.) A single publish step uploads the whole
# dist/; PyPI validates each file against its own project's trusted-publisher
# config.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify the tag matches the lockstep version of all packages
        # bump_version --check fails (naming the fix) unless every package is at
        # this exact version with pinned intra-deps — so a tag can't publish a
        # half-bumped or drifted workspace.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          echo "tag version: $tag"
          uv run --no-sync python -m scripts.bump_version "$tag" --check

      - name: Build sdist + wheel for every package
        # All nine into one dist/. The galaxy-tool-source build hook regenerates
        # its per-version xsdata models from the vendored XSDs; galaxy-tool-refactor
        # is the metapackage (metadata-only wheel).
        run: |
          for pkg in \
            galaxy-tool-refactor-rules \
            galaxy-tool-source \
            galaxy-tool-codemod \
            galaxy-tool-fmt \
            galaxy-tool-lint \
            galaxy-tool-refactor-registry \
            galaxy-tool-refactor-cli \
            galaxy-tool-refactor-mcp \
            galaxy-tool-refactor; do
            echo "::group::build $pkg"
            uv build --package "$pkg"
            echo "::endgroup::"
          done
          ls -l dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish all packages to PyPI
        # Uploads every sdist+wheel in dist/; PyPI matches each against its own
        # project's trusted-publisher config (workflow release.yml, env pypi).
        uses: pypa/gh-action-pypi-publish@release/v1
