name: Test coverage (informational)

# Surfaces test-coverage as an artifact so coverage trends are visible WITHOUT
# gating: this is intentionally not a required check (it is not in ci.yml's `ci`
# aggregator), and it runs only on pushes to main + manual dispatch, so it never
# slows the per-PR loop. There is no threshold — coverage is a signal here, not a
# gate. Mirrors `make test-coverage` (scripts/coverage_report.sh).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync

      - name: Coverage report
        run: bash scripts/coverage_report.sh

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14
