name: Vendored skills upstream check (scheduled)

# Two skills under .claude/skills/ are verbatim copies of external sources
# (dignified-python from dagster-io/skills, optimized-python from a gist). This
# job watches those upstreams and opens a tracking issue when one moves past the
# revision we vendored, so a maintainer can review the delta and decide whether
# to re-vendor. Re-vendoring is deliberate (upstream can change the governing
# coding standard), so the job only detects and reports — it never edits the
# vendored files. The same check runs locally via `make check-skills`.

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC (after the corpus-stats job)
  workflow_dispatch:        # manual "check now"

permissions:
  contents: read
  issues: write

concurrency:
  group: vendored-skills
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Check vendored skills against upstream
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          uv run python -m scripts.check_vendored_skills | tee report.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Open or update the drift tracking issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Vendored skill upstream drift detected"
          body="$(cat report.txt)

          ---
          Generated by \`.github/workflows/vendored-skills.yml\`. Re-vendor per the
          skill's \`VENDORED.md\`, then update the baseline in
          \`scripts/check_vendored_skills.py\` and close this issue."
          existing="$(gh issue list --state open --label vendored-skills \
            --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create vendored-skills --color ededed \
              --description "Vendored-skill upstream drift" 2>/dev/null || true
            gh issue create --title "$title" --label vendored-skills --body "$body"
          fi

      - name: Fail if a source could not be checked
        if: steps.check.outputs.status == '2'
        run: |
          echo "::error::A vendored-skill check could not be completed (see report)."
          exit 1
